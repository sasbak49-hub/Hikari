name: Build Hikari-LLVM for ARM64 (Termux-ready)

on:
  workflow_dispatch:  # Запуск вручную из UI

jobs:
  build:
    runs-on: linux-arm64  # GitHub ARM64 runner (native AArch64 сборка!)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake python3 python3-pip git lld \
            libstdc++-12-dev libc++-dev libc++abi-dev

      - name: Configure with CMake (optimized for size/ARM)
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DCMAKE_SKIP_RPATH=ON \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            ../llvm  # Путь к llvm в Hikari-репо

      - name: Build Clang + LLD
        run: |
          cd build
          ninja clang lld clang-format  # Только нужное, ~20-40 мин

      - name: Package binaries
        run: |
          mkdir -p dist/bin
          cp build/bin/clang* dist/bin/
          cp build/bin/lld dist/bin/
          cp build/bin/llvm-* dist/bin/  # Полезные утилиты
          tar -czf hikari-arm64-bin.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-arm64-bin
          path: build/hikari-arm64-bin.tar.gz
          retention-days: 30
