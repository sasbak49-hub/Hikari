name: Build Hikari for Android (Safe Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Android NDK
        uses: android-actions/setup-android@v2

      - name: Install Ninja & CMake
        run: sudo apt-get install -y ninja-build cmake lld

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            ../llvm

      - name: Build Clang (Single Thread)
        run: |
          cd build
          # -j1 это медленно, но гарантирует, что сервер не зависнет от нехватки RAM
          ninja clang -j1

      - name: Strip Binaries
        run: |
          cd build/bin
          # Удаляем лишнее, чтобы уменьшить вес
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip clang
          cp clang clang++

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-android-arm64-safe
          path: build/bin/
      - name: Build Clang + LLD
        run: |
          cd build
          ninja clang lld clang-format  # Только нужное, ~20-40 мин

      - name: Package binaries
        run: |
          mkdir -p dist/bin
          cp build/bin/clang* dist/bin/
          cp build/bin/lld dist/bin/
          cp build/bin/llvm-* dist/bin/  # Полезные утилиты
          tar -czf hikari-arm64-bin.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-arm64-bin
          path: build/hikari-arm64-bin.tar.gz
          retention-days: 30
