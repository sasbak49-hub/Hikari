name: Build Hikari-LLVM ARM64 (Cross-Compile from x86)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies + Cross-Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake python3 python3-pip git lld \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu libc6-dev-arm64-cross
          # QEMU for cross-sysroot simulation
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Configure CMake (Cross for ARM64)
        run: |
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_ASM_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            ../llvm

      - name: Build Clang + LLD (fast on x86)
        run: |
          cd build
          ninja clang lld clang-format -j8  # Быстро на 64 ядрах GH!

      - name: Strip & Package (small size)
        run: |
          mkdir -p dist/bin
          cd build/bin
          aarch64-linux-gnu-strip clang lld clang-format llvm-*
          cp clang* ../../dist/bin/
          cp lld ../../dist/bin/
          cp llvm-* ../../dist/bin/  # utils
          cd ../../
          tar -czf hikari-arm64-cross.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-arm64-cross-bin
          path: hikari-arm64-cross.tar.gz
          retention-days: 30
