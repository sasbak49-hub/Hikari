name: Build Hikari (Debug & Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          fetch-depth: 1 # Качаем только последний коммит

      - name: Setup Android NDK
        uses: android-actions/setup-android@v2

      - name: Install Ninja & CMake
        run: sudo apt-get install -y ninja-build cmake lld

      # ЭТАП ОТЛАДКИ: Посмотрим, какие файлы реально скачались
      - name: List Files (Debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -la
          echo "Checking if llvm folder exists:"
          ls -la llvm || echo "LLVM FOLDER NOT FOUND!"

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Используем github.workspace, чтобы путь был точным на 100%
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            ${{ github.workspace }}/llvm

      - name: Build Clang (Single Thread)
        run: |
          cd build
          ninja clang -j1

      - name: Strip Binaries
        run: |
          cd build/bin
          ls -la
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip clang
          cp clang clang++

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-android-arm64-debug
          path: build/bin/            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_ASM_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            ../llvm

      - name: Build Clang + LLD (fast on x86)
        run: |
          cd build
          ninja clang lld clang-format -j8  # Быстро на 64 ядрах GH!

      - name: Strip & Package (small size)
        run: |
          mkdir -p dist/bin
          cd build/bin
          aarch64-linux-gnu-strip clang lld clang-format llvm-*
          cp clang* ../../dist/bin/
          cp lld ../../dist/bin/
          cp llvm-* ../../dist/bin/  # utils
          cd ../../
          tar -czf hikari-arm64-cross.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikari-arm64-cross-bin
          path: hikari-arm64-cross.tar.gz
          retention-days: 30
